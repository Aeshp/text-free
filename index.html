<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Free</title>

    <link rel="icon" type="image/x-icon" href="Assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="Assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="Assets/apple-touch-icon.png">
    <link rel="manifest" href="Assets/site.webmanifest">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #FFF8E7;
        }
        
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #F5F0D8; 
        }
        textarea::-webkit-scrollbar-thumb {
            background: #D4C5A9; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #C4B599; 
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .live-dot {
            animation: pulse-green 2s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col" style="background-color: #FFF8E7;">

    <header class="border-b border-amber-200 p-3 sm:p-4 shadow-lg" style="background-color: #FFF8E7;">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 sm:gap-4">
            <a href="./" class="flex items-center gap-0 shrink-0 no-underline">
                <img src="Assets/textfree.svg" alt="Text Free Icon" class="w-9 h-9 sm:w-14 sm:h-14 drop-shadow -my-2 -ml-1 sm:-ml-2 -mr-0.5 sm:-mr-2 object-contain" />
                <h1 class="text-lg sm:text-2xl tracking-tight text-gray-800">
                    <span class="font-extrabold italic">Text</span> <span class="font-bold">Free</span>
                </h1>
            </a>
            
            <div class="flex items-center gap-2 sm:gap-4 flex-wrap justify-end">
                <!--
                  [METRICS DISPLAY - HIDDEN]
                  For developers who want to enable Firebase metrics:
                  Replace this block with the following markup:
                    <div class="hidden sm:flex items-center gap-3 bg-white px-3 py-1.5 rounded-full border border-amber-200 shadow-sm">
                        <div class="w-2 h-2 rounded-full bg-green-500 live-dot shrink-0"></div>
                        <span class="text-xs font-semibold text-gray-600 whitespace-nowrap">
                            🔥 <span id="metricRemovals" class="text-blue-600 font-bold">...</span> removals
                        </span>
                        <span class="text-xs text-gray-300">|</span>
                        <span class="text-xs font-semibold text-gray-600 whitespace-nowrap">
                            ⚡ <span id="metricCharacters" class="text-blue-600 font-bold">...</span> processed
                        </span>
                    </div>
                  Ensure Firebase is configured correctly. Metrics will automatically start displaying.
                -->
                <div class="hidden sm:flex items-center gap-3 bg-white px-3 py-1.5 rounded-full border border-amber-200 shadow-sm">
                    <span class="text-xs font-semibold text-gray-600 flex items-center gap-2">
                        ⚙️ Metrics system included
                        <button id="metricsInfoBtn" class="text-gray-400 hover:text-gray-600 transition-colors" title="About metrics"><i class="fa-solid fa-circle-info"></i></button>
                    </span>
                </div>

                <a href="https://github.com/Aeshp/text-free" target="_blank" rel="noopener noreferrer"
                   class="inline-flex items-center gap-1.5 sm:gap-2 px-2.5 sm:px-4 py-1.5 sm:py-2 text-xs sm:text-sm font-semibold text-white bg-black hover:bg-gray-200 hover:text-black rounded-lg shadow transition-colors shrink-0">
                   <i class="fa-brands fa-github"></i> Code
                </a>
            </div>
        </div>
    </header>

    <!--
      [MOBILE METRICS DISPLAY - HIDDEN]
      For developers who want to enable Firebase metrics:
      Replace this block with the following markup:
        <div class="flex sm:hidden items-center justify-center gap-2 bg-white mx-3 mt-3 px-3 py-2 rounded-full border border-amber-200 shadow-sm">
            <div class="w-1.5 h-1.5 rounded-full bg-green-500 live-dot shrink-0"></div>
            <span class="text-[11px] font-semibold text-gray-600">
                🔥 <span id="metricRemovalsMobile" class="text-blue-600 font-bold">...</span> removals
            </span>
            <span class="text-[11px] text-gray-300">|</span>
            <span class="text-[11px] font-semibold text-gray-600">
                ⚡ <span id="metricCharactersMobile" class="text-blue-600 font-bold">...</span> processed
            </span>
        </div>
      Ensure Firebase is configured correctly. Metrics will automatically start displaying.
    -->
    <div class="flex sm:hidden items-center justify-center gap-2 bg-white mx-3 mt-3 px-3 py-2 rounded-full border border-amber-200 shadow-sm">
        <span class="text-[11px] font-semibold text-gray-600 flex items-center gap-2">
            ⚙️ Metrics system included
            <button id="metricsInfoBtnMobile" class="text-gray-400 hover:text-gray-600 transition-colors" title="About metrics"><i class="fa-solid fa-circle-info text-[11px]"></i></button>
        </span>
    </div>

    <main class="flex-grow p-3 sm:p-4 md:p-6 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6">

        <div class="flex flex-col gap-3 sm:gap-4 h-full">
            
            <div class="flex-grow flex flex-col min-h-[200px] sm:min-h-[300px]">
                <label class="text-xs sm:text-sm font-semibold text-gray-700 mb-1.5 sm:mb-2 flex justify-between items-center">
                    <span>1. Paste Full Content Here</span>
                    <span class="flex items-center gap-2">
                        <span id="charCount" class="text-gray-600 font-normal">0 chars</span>
                        <button onclick="clearSource()" class="text-xs text-blue-500 hover:text-blue-700 underline font-normal">Clear</button>
                    </span>
                </label>
                <textarea 
                    id="sourceText" 
                    placeholder="Paste the long text with the repeated paragraphs here..." 
                    class="w-full h-full border border-amber-200 rounded-lg p-3 sm:p-4 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none resize-none transition-all text-sm leading-relaxed shadow-inner"
                    style="background-color: #FFFFFF;"
                ></textarea>
            </div>

            <div class="h-28 sm:h-40 flex flex-col">
                <label class="text-xs sm:text-sm font-semibold text-gray-700 mb-1.5 sm:mb-2 text-blue-600 flex justify-between items-center">
                    <span>2. Paragraph to Delete (Editable)</span>
                    <button onclick="clearPattern()" class="text-xs text-blue-500 hover:text-blue-700 underline font-normal">Clear</button>
                </label>
               
                <textarea 
                    id="removePattern" 
                    placeholder="Paste the exact repeated paragraph you want to remove here..." 
                    class="w-full h-full border-l-4 border-blue-500 rounded-r-lg p-2.5 sm:p-3 text-gray-800 outline-none resize-none text-xs leading-relaxed shadow-inner"
                    style="background-color: #FFFFFF;"
                ></textarea>
            </div>

            <button 
                onclick="processText()"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-lg transition-all transform active:scale-95 shadow-lg flex items-center justify-center gap-2"
            >
                Clean Text
            </button>
        </div>

        <div class="flex flex-col min-h-[250px] sm:min-h-0 h-full rounded-xl border border-amber-200 shadow-xl overflow-hidden" style="background-color: #FFFFFF;">
            <div class="p-3 sm:p-4 border-b border-amber-200 flex justify-between items-center" style="background-color: #FFF8E7;">
                <h2 class="text-sm sm:text-base font-semibold text-green-600 flex items-center gap-2">
                    <i class="fa-regular fa-file-lines"></i> Result
                </h2>
                <div class="flex gap-2 items-center">
                    <span id="statusMsg" class="text-[10px] sm:text-xs text-gray-600 flex items-center mr-1 sm:mr-2"></span>
                    <button onclick="copyResult()" class="text-[10px] sm:text-xs bg-gray-700 hover:bg-gray-600 text-white px-2 sm:px-3 py-1 sm:py-1.5 rounded transition-colors border border-gray-600">
                        <i class="fa-regular fa-copy"></i> Copy
                    </button> 
                </div>
            </div>
            
            <textarea 
                id="outputText" 
                readonly 
                placeholder="The cleaned text will appear here..." 
                class="w-full flex-grow p-3 sm:p-4 text-gray-800 outline-none resize-none text-sm leading-relaxed"
                style="background-color: #FFFFFF;"
            ></textarea>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        /*
          Firebase Metrics System
          For developers who want to enable Firebase metrics:

          - Metrics run silently when Firebase config is provided (via env variables)
          - If config values are placeholders, Firebase is safely disabled
          - No errors will occur in local/dev environments

          To enable metrics:
          1. Provide real Firebase config (via Vercel env variables or replace placeholders)
          2. Restore the metric spans in the HTML above (see [METRICS DISPLAY - HIDDEN] comments)
          3. Metrics will automatically start displaying in real time
        */
        const firebaseConfig = {
            apiKey: "__FIREBASE_API_KEY__",
            authDomain: "__FIREBASE_AUTH_DOMAIN__",
            projectId: "__FIREBASE_PROJECT_ID__",
            storageBucket: "__FIREBASE_STORAGE_BUCKET__",
            messagingSenderId: "__FIREBASE_MESSAGING_SENDER_ID__",
            appId: "__FIREBASE_APP_ID__",
            measurementId: "__FIREBASE_MEASUREMENT_ID__"
        };

        const isFirebaseConfigured =
            firebaseConfig.apiKey &&
            firebaseConfig.apiKey !== "__FIREBASE_API_KEY__";

        let db = null;
        let statsRef = null;

        if (isFirebaseConfigured) {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            statsRef = doc(db, "stats", "global_metrics");
        }

        function formatCompact(num) {
            if (num >= 1e6) return (num / 1e6).toFixed(1) + "M";
            if (num >= 1e3) return (num / 1e3).toFixed(1) + "K";
            return num.toString();
        }

        // [METRICS LISTENER - ACTIVE]
        // Firebase onSnapshot listener runs silently in background.
        // To display metrics in UI, restore the metric spans (see HTML comments above).
        if (isFirebaseConfigured && statsRef) {
            onSnapshot(statsRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const removals = (data.totalRemovals || 0).toLocaleString();
                    const characters = formatCompact(data.totalCharacters || 0);

                    const elRemovals = document.getElementById('metricRemovals');
                    const elCharacters = document.getElementById('metricCharacters');
                    const elRemovalsMobile = document.getElementById('metricRemovalsMobile');
                    const elCharactersMobile = document.getElementById('metricCharactersMobile');
                    if (elRemovals) elRemovals.innerText = removals;
                    if (elCharacters) elCharacters.innerText = characters;
                    if (elRemovalsMobile) elRemovalsMobile.innerText = removals;
                    if (elCharactersMobile) elCharactersMobile.innerText = characters;
                }
            }, (error) => {
                console.error("Snapshot error:", error);
            });
        }

        let metricsLock = false;

        async function updateMetrics(charCount, removalCount) {
            if (!isFirebaseConfigured || !db || !statsRef) return;
            if (metricsLock) return;
            metricsLock = true;
            try {
                await runTransaction(db, async (transaction) => {
                    const docSnap = await transaction.get(statsRef);
                    if (!docSnap.exists()) return;

                    const data = docSnap.data();
                    transaction.update(statsRef, {
                        totalCharacters: data.totalCharacters + charCount,
                        totalRemovals: data.totalRemovals + removalCount,
                        lastUpdated: serverTimestamp()
                    });
                });
            } catch (err) {
                console.error("Metrics update failed", err);
            } finally {
                metricsLock = false;
            }
        }

        let lastEventSignature = sessionStorage.getItem("tf_lastSig") || "";
        let lastEventTime = parseInt(sessionStorage.getItem("tf_lastTs")) || 0;

        let requestCount = 0;
        let windowStart = Date.now();

        function allowRequest() {
            const now = Date.now();
            if (now - windowStart > 10000) {
                windowStart = now;
                requestCount = 0;
            }
            requestCount++;
            return requestCount <= 3;
        }

        const sourceInput = document.getElementById('sourceText');
        const patternInput = document.getElementById('removePattern');
        const outputInput = document.getElementById('outputText');
        const charCountEl = document.getElementById('charCount');
        const statusMsg = document.getElementById('statusMsg');
        const cleanBtn = document.querySelector('button[onclick="processText()"]');

        let nextAllowedTime = 0;
        let countdownInterval = null;

        function startCountdown(ms) {
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }

            let seconds = Math.ceil(ms / 1000);

            countdownInterval = setInterval(() => {
                if (seconds <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    return;
                }
                statusMsg.textContent = `Counting in ${seconds}...`;
                statusMsg.className = "text-xs text-yellow-600 flex items-center mr-2 font-bold";
                seconds--;
            }, 1000);
        }

        sourceInput.addEventListener('input', () => {
            const len = sourceInput.value.length;
            charCountEl.textContent = `${len.toLocaleString()} chars`;
        });

        function clearSource() {
            sourceInput.value = '';
            charCountEl.textContent = '0 chars';
            sourceInput.focus();
        }

        function clearPattern() {
            patternInput.value = '';
            patternInput.focus();
        }

        async function processText() {
            const fullText = sourceInput.value;
            const garbageText = patternInput.value;

            if (!fullText) {
                alert("Please paste the content you want to clean first.");
                return;
            }

            if (!garbageText) {
                alert("Please paste the paragraph/sentence you want to remove.");
                return;
            }

            if (cleanBtn) cleanBtn.disabled = true;

            try {
                const parts = fullText.split(garbageText);
                const count = parts.length - 1;

                let cleanedText = parts.join('');
                cleanedText = cleanedText.replace(/\n{3,}/g, '\n\n');
                outputInput.value = cleanedText;

                if (count > 0) {
                    statusMsg.textContent = `Removed ${count} instances`;
                    statusMsg.className = "text-xs text-green-600 flex items-center mr-2 font-bold";

                    if (fullText.length >= 20 && fullText.length <= 50000) {

                        const signature = fullText + "::" + garbageText + "::" + count;
                        const now = Date.now();
                        if (signature !== lastEventSignature || now - lastEventTime > 3000) {

                            if (now < nextAllowedTime) {
                                startCountdown(nextAllowedTime - now);
                            }
                            else if (!allowRequest()) {
                                console.log("Rate limit hit");
                            }
                            else {
                                lastEventSignature = signature;
                                lastEventTime = now;
                                sessionStorage.setItem("tf_lastSig", signature);
                                sessionStorage.setItem("tf_lastTs", now.toString());
                                nextAllowedTime = now + 3000;
                                await updateMetrics(fullText.length, Math.min(count, 50));
                            }
                        }
                    }
                } else {
                    statusMsg.textContent = "Pattern not found";
                    statusMsg.className = "text-xs text-red-600 flex items-center mr-2 font-bold";
                }
            } finally {
                if (cleanBtn) cleanBtn.disabled = false;
            }
        }

        function copyResult() {
            const textToCopy = outputInput.value;
            if (!textToCopy) return;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = statusMsg.textContent;
                const originalClass = statusMsg.className;

                statusMsg.textContent = "Copied to clipboard!";
                statusMsg.className = "text-xs text-blue-600 flex items-center mr-2 font-bold";

                setTimeout(() => {
                    statusMsg.textContent = originalText;
                    statusMsg.className = originalClass;
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        window.clearSource = clearSource;
        window.clearPattern = clearPattern;
        window.processText = processText;
        window.copyResult = copyResult;

        const infoBtn = document.getElementById("metricsInfoBtn");
        const infoBtnMobile = document.getElementById("metricsInfoBtnMobile");
        const infoBox = document.getElementById("metricsInfoBox");
        const closeBtn = document.getElementById("closeMetricsInfo");

        function showInfoBox() {
            if (infoBox) infoBox.classList.remove("hidden");
        }

        if (infoBtn) infoBtn.onclick = showInfoBox;
        if (infoBtnMobile) infoBtnMobile.onclick = showInfoBox;

        if (closeBtn && infoBox) {
            closeBtn.onclick = () => {
                infoBox.classList.add("hidden");
            };
        }
    </script>

    <div id="metricsInfoBox" class="hidden fixed bottom-4 right-4 max-w-xs bg-white border border-gray-200 shadow-lg rounded-lg p-4 text-xs text-gray-700 z-50">
        <p>
            This app includes a Firebase-based usage metrics system.

            Metrics are not shown in this version. To enable them, update the UI in the GitHub repository where the implementation is already available.
        </p>
        <button id="closeMetricsInfo" class="mt-2 text-blue-600 text-xs underline">Close</button>
    </div>

</body>
</html>
